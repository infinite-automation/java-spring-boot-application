name: Java CICD Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build with Maven
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build the application
        run: sh ./mvnw --batch-mode --no-transfer-progress clean package -DskipTests

      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/hello-java-*.jar
          if-no-files-found: error

  test:
    name: Test and scan the code
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run unit and application tests
        run: |
          sh ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-and-coverage
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: warn
