apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-java
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-java
  template:
    metadata:
      labels:
        app: hello-java
    spec:
      containers:
        - name: hello-java
          image: infiniteautomation/hello-java:abee3a473a3e788ee0dacd0b7967b56f4b5baf0e
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
